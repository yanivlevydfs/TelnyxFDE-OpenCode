# Editor type-checking for this repo (overrides h:\GitHub\pyrefly.toml).
# shared/ and assistant/ hold modules imported by bare name (common, flow).
search-path = [".", "shared", "assistant", "services/webhook"]
python-interpreter = ".venv/Scripts/python.exe"
# tests/ holds the acceptance tests (not edited); their fakes are duck-typed.
# reference/ is a local, git-ignored copy of the flytlv client (not shipped).
project-excludes = ["tests/**", "reference/**", "**/node_modules/**", "**/.venv/**"]
