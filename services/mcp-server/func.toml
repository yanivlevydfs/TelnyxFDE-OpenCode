# services/mcp-server/func.toml — Telnyx Edge Function manifest (TypeScript).
# Deploy:  telnyx-edge ship --from-dir services/mcp-server

[edge_compute]
func_id = "bc3393fa-a5f2-4470-b7af-137f3d9c831d"
func_name = "fde-mcp"

# KV binding used by src/kv.ts via `env.KV` (@telnyx/edge-runtime):
#   await env.KV.get(key, { type: "json" })
#   await env.KV.put(key, JSON.stringify(v), { expirationTtl: secs })
# Holds the session/<conversation_id> -> {entity_id} map (written by the
# webhook) and the cache/deals/<query> deals cache.
# Telnyx API binding: env.TELNYX is a pre-authenticated SDK client, used by
# src/sms.ts to send deal links by SMS.
[telnyx]
binding = "TELNYX"

[storage.kv.KV]
id = "445c3e11-c172-48df-af37-3486ca3ff50c"

# Shared Stateful Actor (Telnyx "shared actors"). The `fde-session-actor`
# function owns the `CallerSession` class; this function declares the same
# `type` under the SESSIONS binding and ships no class code (AGENTS.md step 8).
# src/actor.ts's `EdgeActor` calls `env.SESSIONS.idFromName(entityId)[method](body)`
# directly, bypassing the HTTP facade the Python webhook still needs (Python
# Edge functions cannot bind actors). The facade stays up at ACTOR_SERVICE_URL
# for the webhook (`[[actors]] binding = "CALLER_SESSION" type = "CallerSession"`
# already lives in services/session-actor/telnyx.toml).
[[actors]]
binding = "SESSIONS"
type    = "CallerSession"

# Non-secret configuration only. Secrets live in Edge secrets
# (`telnyx-edge secrets add <NAME> <VALUE>`) and are injected as env vars:
#   MCP_API_KEY          bearer token registered with Telnyx as api_key_ref
#   FLYTLV_API_KEY       flytlv.app private deals feed (X-API-Key)
#   ACTOR_SERVICE_URL    session-actor Edge Function URL (HTTP facade). Always
#                       required by this function: the per-request metrics
#                       update POSTs to /metrics/add (the shared MetricsCounter
#                       actor) over HTTP even when USE_SHARED_ACTOR="true" — the
#                       SESSIONS binding is CallerSession-only.
#   INTERNAL_API_TOKEN   facade bearer — sent on every /metrics/add POST and on
#                       the ActorClient fallback path (USE_SHARED_ACTOR="false")
#
# Itinerary + reminder config. Live finding (step 11, 7 Oct 08:52 UTC): the
# umbrella telnyx.toml `[env_vars]` for `fde-session-actor` do NOT reach actor
# instances' `process.env` (logged `itinerary_skipped reason=noITINERARY_BASE_URL`),
# while this function's `func.toml` `[env_vars]` do. So the four values below
# are read here on every save_call and forwarded to the actor inside the
# `saveDeal` body as `config` (see src/server.ts). The actor resolves
# `config.X ?? process.env.X` — the value sent with the call wins (the call
# is authoritative here, since this function's [env_vars] are honoured by the
# runtime); the actor's own `process.env` is the fallback for unit tests /
# local dev / once the platform honours the actor umbrella). SMS_FROM and
# MESSAGING_PROFILE_ID were already here for `send_deal_sms`; the other two
# moved here from services/session-actor/telnyx.toml (whose values stay as
# the unit-test / fallback source of truth).
[env_vars]
MCP_SERVER_NAME = "fde-mcp"
# When "true" (default) src/index.ts wires `EdgeActor`, which binds the shared
# CallerSession actor directly via `env.SESSIONS` (no HTTP hop). Set to "false"
# to fall back to `ActorClient` against ACTOR_SERVICE_URL — used by the
# Python webhook, which cannot bind actors, and useful for local debugging.
USE_SHARED_ACTOR = "true"
FLYTLV_API_BASE = "https://flytlv.app"
FLYTLV_DEALS_PATH = "/api/private/deals"
FLYTLV_API_KEY_HEADER = "X-API-Key"
FLYTLV_TIMEOUT_MS = "3000"        # short: a phone caller is on the line
DEALS_FETCH_LIMIT = "20"         # how many deals to pull from flytlv per query
DEALS_RESULT_LIMIT = "5"         # how many to speak back / remember per call
DEALS_CACHE_TTL = "300"          # seconds; flytlv caches ~10 min server-side
DEALS_CACHE_PREFIX = "cache/deals/"
SESSION_KEY_PREFIX = "session/"  # written by the webhook, read by the tools
HTTP_TIMEOUT_MS = "3000"
TRACE_HEADER = "x-trace-id"      # outbound trace header to the actor
LOG_LEVEL = "INFO"
SMS_FROM = "FlyTLV"                # alphanumeric sender (Israeli numbers are voice-only)
MESSAGING_PROFILE_ID = "4001a112-28fd-40f5-a0de-226b1bad6b80"  # profile flytlv-sms: IL only, $5/day cap
# Itinerary + reminder — forwarded on every saveDeal actor call (live finding,
# see the [env_vars] header above for the why). The actor builds the reminder
# delay and the public itinerary URL from these (with its own process.env
# fallback for unit tests / local dev).
ITINERARY_BASE_URL = "https://fde-session-actor-94b99eb9-4.telnyxcompute.com"
REMINDER_DELAY_SECONDS = "600"

# FlyTLV feed endpoints + request shape.
FLYTLV_FLIGHTS_PATH = "/api/private/flights"  # one-way feed (round trips use FLYTLV_DEALS_PATH)

# Search sizing. A "broad" search (country / category / weekend / discount) fetches
# every destination's best deal; DEALS_BROAD_FETCH_LIMIT caps it, falling back to
# DEALS_COUNTRY_FETCH_LIMIT when unset.
DEALS_BROAD_FETCH_LIMIT = "300"
DEALS_COUNTRY_FETCH_LIMIT = "300"

# Caller-side filtering knobs (best-effort; the flytlv feed ignores most).
CALLER_TIMEZONE = "Asia/Jerusalem"  # weekend date computation + departure cutoff tz
MIN_HOURS_BEFORE_DEPARTURE = "3"     # hide flights leaving sooner than this

# KV flags key (best-effort SMS enable flag; same value as the webhook).
KV_FLAGS_KEY = "flags/assistant"

# Logging timezone (LOG_LEVEL is already declared above; LOG_TIMEZONE is read
# directly via process.env by src/log.ts).
LOG_TIMEZONE = "Asia/Jerusalem"
