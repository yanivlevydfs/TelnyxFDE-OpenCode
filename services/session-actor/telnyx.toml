# services/session-actor/telnyx.toml — Telnyx Edge Actor "umbrella" manifest.
#
# Stateful Actor projects ship from an umbrella `telnyx.toml` (not from a
# `func.toml`). It carries the entry handler, the actor type binding, and the
# secrets binding — no `func_id` is required (AGENTS.md).
#
# Deploy:  cd services/session-actor && telnyx-edge ship

# Project identity + entry point. `main` is the Worker default export called
# by the Edge runtime on every fetch.
name = "fde-session-actor"
main = "src/index.ts"

# Pin the runtime compatibility date to the build of `@telnyx/edge-runtime`
# we develop against (0.16.0). Older runtime quirks are not opted into.
compatibility_date = "2026-05-01"

# Two actor types. CallerSession on `env.CALLER_SESSION`; the class name (type)
# MUST equal the exported `CallerSession` class in src/index.ts. Each caller
# (digits of their phone) is its own actor instance, isolated & single-threaded.
[[actors]]
binding = "CALLER_SESSION"
type    = "CallerSession"

# Shared service-wide metrics (counters + latency), one instance "global",
# updated by the webhook and the MCP server through POST /metrics/add.
[[actors]]
binding = "METRICS"
type    = "MetricsCounter"

# Pre-authenticated Telnyx SDK client. `env.TELNYX.messages.send(...)` is used
# by `CallerSession.alarm()` to text the follow-up reminder to the caller; the
# Messaging profile and sender come from [env_vars] below.
[telnyx]
binding = "TELNYX"

# Cloud Storage bucket where `CallerSession.saveDeal` writes the itinerary
# HTML pages the public `GET /itineraries/<uuid>.html` route in src/index.ts
# then streams back. The bucket is created from outside the function (console
# or `telnyx-edge storage`) and referenced here by name + region.
[storage.cloudstorage.ITINERARIES]
bucket_name = "flytlv-itineraries"
region      = "us-central-1"

# Edge secrets binding. The HTTP facade reads `INTERNAL_API_TOKEN` through
# this binding (`env.SECRETS.get("INTERNAL_API_TOKEN")`); it is the shared
# bearer the webhook (Python) and mcp-server (TypeScript) send in their
# `Authorization: Bearer` header. Secrets themselves are not stored in this
# file — they are added with `telnyx-edge secrets add INTERNAL_API_TOKEN <v>`.
[[secrets]]
binding = "INTERNAL_API_TOKEN"   # handle: env.SECRETS.get("INTERNAL_API_TOKEN")
name    = "INTERNAL_API_TOKEN"   # the key stored with `telnyx-edge secrets add`

# Non-secret runtime knobs are read via `process.env`:
#   INTERNAL_API_TOKEN          bearer token (Edge secret, see [[secrets]])
#   LOG_LEVEL                   DEBUG | INFO (default) | WARNING | ERROR
#   LOG_TIMEZONE                log timestamp timezone (default Asia/Jerusalem)
#   TRACE_HEADER                inbound trace header (default x-trace-id)
#   MAX_SAVED_DEALS             saved deals kept per caller (default 50)
# Itinerary + reminder (added step 7):
#   ITINERARY_BASE_URL          public prefix for itinerary pages (served by
#                               this function at /itineraries/<uuid>.html).
#   REMINDER_DELAY_SECONDS      delay before the follow-up SMS fires (default 600).
#   SMS_FROM                    alphanumeric Telnyx messaging sender id.
#   MESSAGING_PROFILE_ID        Telnyx messaging profile for the reminder SMS.
# History + audit (added step 20):
#   AUDIT_PREFIX                Cloud Storage key prefix for audit objects
#                               (default "audit/"); reads via process.env
#                               (defaults in production — see AGENTS.md live
#                               finding, decision #28).
#   SEARCH_HISTORY_MAX          entries kept in the per-caller searchHistory
#                               timeline (default 50, oldest dropped).
#
# ***Live finding (step 11, 7 Oct 08:52 UTC):*** these `[env_vars]` do NOT reach
# actor instances' `process.env` in production (logs showed
# `itinerary_skipped reason=noITINERARY_BASE_URL`). The bound
# `[storage.cloudstorage.ITINERARIES]` bucket DOES reach the actor, but the
# umbrella `telnyx.toml [env_vars]` are not honoured by the actor runtime.
# (The MCP `func.toml [env_vars]` for `fde-mcp` ARE honoured — verified live —
# so the MCP server forwards the four itinerary/reminder values on every
# `saveDeal` call in `config`, and `CallerSession.saveDeal` resolves
# `config.X ?? process.env.X`.) The entries below stay as the source of truth
# for unit tests, local dev, and as the fallback path once the platform
# honours the actor umbrella.
[env_vars]
ITINERARY_BASE_URL     = "https://fde-session-actor-94b99eb9-4.telnyxcompute.com"
REMINDER_DELAY_SECONDS = "600"
SMS_FROM              = "FlyTLV"
MESSAGING_PROFILE_ID  = "4001a112-28fd-40f5-a0de-226b1bad6b80"

# Function identity, written by `telnyx-edge new-func --actor` (ship requires it).
[edge_compute]
func_id = "94b99eb9-4c3e-4790-8e2a-8db700bea1a5"
func_name = "fde-session-actor"
