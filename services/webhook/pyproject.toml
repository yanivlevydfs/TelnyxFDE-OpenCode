# services/webhook/pyproject.toml
# The Edge build installs these dependencies before shipping `function/`.
#
# Telnyx Edge builds Python functions with Python 3.9, so the dependency set is
# pinned to versions verified to resolve together on 3.9:
#   telnyx[webhooks]==4.182.0 + httpx==0.28.1 + starlette==0.49.3.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "function"
version = "0.1.0"
description = "Dynamic Variables webhook for the FlyTLV Travel Line assistant"
requires-python = ">=3.9"
dependencies = [
    "telnyx[webhooks]==4.182.0", # KV REST API + Ed25519 webhook signature check
    "httpx==0.28.1",             # session-actor HTTP calls
    "starlette==0.49.3",          # ASGI routing for POST / (resolves on Python 3.9)
    "tzdata==2025.2",             # timezone data for Israel-time log timestamps
]

[tool.hatch.build.targets.wheel]
packages = ["function"]
