# services/webhook/func.toml — Telnyx Edge Function manifest.
# Deploy:  telnyx-edge ship --from-dir services/webhook

[edge_compute]
func_id = "e5907143-e572-4e86-8880-0de76f057561"
func_name = "fde-webhook"

[telnyx]
# String binding handle; injects TELNYX_API_KEY so the official SDK can call the KV REST API.
binding = "TELNYX"

# Non-secret configuration only. Secrets live in Edge secrets
# (`telnyx-edge secrets add <NAME> <VALUE>`) and are injected as env vars:
#   TELNYX_PUBLIC_KEY, KV_NAMESPACE_ID, ACTOR_SERVICE_URL, INTERNAL_API_TOKEN
[env_vars]
WEBHOOK_VERIFY_SIGNATURE = "true" # false ONLY for local curl testing
WEBHOOK_BUDGET_MS = "2500"        # fan-out budget; below dynamic_variables_webhook_timeout_ms (8000)
HTTP_TIMEOUT_MS = "1000"          # outbound HTTP timeout (actor calls) in ms
KV_FLAGS_KEY = "flags/assistant"
FLAGS_CACHE_SECS = "60"           # seconds the KV flags are cached in-process (per client)
SESSION_KEY_PREFIX = "session/"   # maps a conversation id to the caller's entity id
SESSION_TTL = "3600"               # TTL of the session map entry (seconds)
TRACE_HEADER = "x-trace-id"        # header carrying the trace id to the actor
LOG_LEVEL = "INFO"                 # DEBUG | INFO | WARNING | ERROR (log line gate)
LOG_TIMEZONE = "Asia/Jerusalem"    # timezone of the "ts" field in every log line
